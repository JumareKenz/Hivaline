<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGE-M3 Quantization Test - Android</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #0f0;
            background: #001100;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            background: #002200;
        }
        .error {
            color: #f00;
            background: #220000;
        }
        .success {
            color: #0f0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-family: monospace;
            margin: 10px 0;
            cursor: pointer;
        }
        button:disabled {
            background: #333;
            color: #666;
        }
        .progress {
            color: #ff0;
        }
    </style>
</head>
<body>
    <h1>BGE-M3 Quantization Test</h1>
    <div id="device-info" class="test-section"></div>

    <div class="test-section">
        <h2>Test Controls</h2>
        <button id="test-q8" onclick="testModel('bge-m3')">Test q8 (560MB)</button>
        <button id="test-q4f16" onclick="testModel('bge-m3-q4f16')">Test q4f16 (668MB)</button>
        <button id="test-q4" onclick="testModel('bge-m3-q4')">Test q4 (1.2GB)</button>
        <button onclick="testAll()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script type="module">
        const testQueries = [
            "How do I treat HIV?",
            "Dosage for children 5-10kg",
            "What are the symptoms of tuberculosis?",
            "When should I refer a patient?",
            "Malaria prophylaxis for pregnant women",
            "Side effects of artemisinin",
            "How to diagnose pneumonia",
            "Treatment for severe malnutrition",
            "Signs of dehydration",
            "Vaccination schedule for infants"
        ];

        const referenceQuery = "What is the treatment for malaria?";

        // Display device info
        function showDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                cores: navigator.hardwareConcurrency || 'unknown',
                memory: navigator.deviceMemory ? `${navigator.deviceMemory}GB` : 'unknown',
                connection: navigator.connection ? navigator.connection.effectiveType : 'unknown'
            };

            document.getElementById('device-info').innerHTML = `
                <h2>Device Information</h2>
                <div class="result">
                    <strong>Platform:</strong> ${info.platform}<br>
                    <strong>Cores:</strong> ${info.cores}<br>
                    <strong>Memory:</strong> ${info.memory}<br>
                    <strong>Connection:</strong> ${info.connection}<br>
                    <strong>User Agent:</strong> ${info.userAgent}
                </div>
            `;
        }

        async function testModel(modelId) {
            const startTime = Date.now();
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-section';
            resultDiv.innerHTML = `<h3>Testing ${modelId}</h3><div class="progress">Loading model...</div>`;
            document.getElementById('results').appendChild(resultDiv);

            // Disable buttons during test
            document.querySelectorAll('button').forEach(btn => btn.disabled = true);

            try {
                // Import transformers
                const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');

                // Configure environment
                env.allowRemoteModels = false;
                env.allowLocalModels = true;
                env.useBrowserCache = true;
                env.localModelPath = '/models/';

                // 1. Cold load
                resultDiv.querySelector('.progress').textContent = 'Loading model (cold)...';
                const loadStart = performance.now();

                const model = await pipeline('feature-extraction', modelId, {
                    quantized: true,
                    progress_callback: (progress) => {
                        if (progress.progress !== undefined) {
                            resultDiv.querySelector('.progress').textContent =
                                `Loading: ${progress.file} (${Math.round(progress.progress)}%)`;
                        }
                    }
                });

                const loadTime = performance.now() - loadStart;

                // 2. Verify output
                resultDiv.querySelector('.progress').textContent = 'Verifying output...';
                const refOutput = await model(referenceQuery, { pooling: 'cls', normalize: true });
                const embedding = Array.from(refOutput.data);
                const dims = embedding.length;

                if (dims !== 1024) {
                    throw new Error(`Wrong dimensions: ${dims} (expected 1024)`);
                }

                // 3. Warm inference latency
                resultDiv.querySelector('.progress').textContent = 'Running warm inference tests...';
                const latencies = [];

                for (let i = 0; i < testQueries.length; i++) {
                    const query = testQueries[i];
                    const start = performance.now();
                    await model(query, { pooling: 'cls', normalize: true });
                    const latency = performance.now() - start;
                    latencies.push(latency);
                }

                const avgLatency = latencies.reduce((a, b) => a + b, 0) / latencies.length;
                const minLatency = Math.min(...latencies);
                const maxLatency = Math.max(...latencies);

                // 4. Memory (approximate)
                const memUsed = performance.memory ?
                    Math.round(performance.memory.usedJSHeapSize / 1024 / 1024) : 'N/A';
                const memTotal = performance.memory ?
                    Math.round(performance.memory.totalJSHeapSize / 1024 / 1024) : 'N/A';

                // Calculate multipliers
                const vsMinilm = (avgLatency / 10).toFixed(2);
                const vsQ8 = (avgLatency / 84).toFixed(2);

                // Display results
                resultDiv.innerHTML = `
                    <h3>${modelId} - ✅ SUCCESS</h3>
                    <div class="result success">
                        <strong>1. Cold Load Time:</strong> ${loadTime.toFixed(0)}ms (${(loadTime/1000).toFixed(1)}s)<br><br>

                        <strong>2. Output Verification:</strong><br>
                        &nbsp;&nbsp;Dimensions: ${dims} ✓<br>
                        &nbsp;&nbsp;Sample: [${embedding.slice(0, 5).map(v => v.toFixed(4)).join(', ')}...]<br><br>

                        <strong>3. Warm Inference Latency:</strong><br>
                        &nbsp;&nbsp;Average: <strong>${avgLatency.toFixed(1)}ms</strong><br>
                        &nbsp;&nbsp;Min: ${minLatency.toFixed(1)}ms<br>
                        &nbsp;&nbsp;Max: ${maxLatency.toFixed(1)}ms<br>
                        &nbsp;&nbsp;vs MiniLM (10ms): <strong>${vsMinilm}x slower</strong><br>
                        &nbsp;&nbsp;vs q8 baseline (84ms): <strong>${vsQ8}x</strong> ${avgLatency > 84 ? 'slower' : 'faster'}<br><br>

                        <strong>4. Memory Usage:</strong><br>
                        &nbsp;&nbsp;Used: ${memUsed}MB<br>
                        &nbsp;&nbsp;Total: ${memTotal}MB<br><br>

                        <strong>Total Test Time:</strong> ${((Date.now() - startTime) / 1000).toFixed(1)}s
                    </div>
                `;

                // Log to console for easier extraction
                console.log(`[${modelId}] RESULTS:`, {
                    coldLoad: loadTime,
                    avgLatency,
                    minLatency,
                    maxLatency,
                    memUsed,
                    memTotal,
                    vsMinilm,
                    vsQ8
                });

            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>${modelId} - ❌ FAILED</h3>
                    <div class="result error">
                        <strong>Error:</strong> ${error.message}<br>
                        <strong>Stack:</strong><br>
                        <pre>${error.stack}</pre><br>
                        <strong>Time before failure:</strong> ${((Date.now() - startTime) / 1000).toFixed(1)}s
                    </div>
                `;
                console.error(`[${modelId}] FAILED:`, error);
            } finally {
                // Re-enable buttons
                document.querySelectorAll('button').forEach(btn => btn.disabled = false);
            }
        }

        async function testAll() {
            document.getElementById('results').innerHTML = '';
            await testModel('bge-m3');
            await testModel('bge-m3-q4f16');
            await testModel('bge-m3-q4');
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        window.testModel = testModel;
        window.testAll = testAll;
        window.clearResults = clearResults;

        // Show device info on load
        showDeviceInfo();
    </script>
</body>
</html>
