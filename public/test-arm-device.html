<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARM Device Test - bge-m3 q8</title>
    <style>
        body {
            font-family: monospace;
            padding: 10px;
            background: #000;
            color: #0f0;
            font-size: 12px;
        }
        .result {
            margin: 5px 0;
            padding: 5px;
            background: #001100;
            border: 1px solid #0f0;
        }
        .error { color: #f00; background: #220000; }
        .progress { color: #ff0; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-family: monospace;
            margin: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            background: #333;
            color: #666;
        }
        pre { font-size: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>Physical ARM Device Test</h2>
    <div id="device-info" class="result"></div>
    <button id="start-btn" onclick="runFullTest()">START TEST</button>
    <div id="output"></div>

    <script type="module">
        const testQueries = [
            "How do I treat HIV?",
            "Dosage for children 5-10kg",
            "What are the symptoms of tuberculosis?",
            "When should I refer a patient?",
            "Malaria prophylaxis for pregnant women",
            "Side effects of artemisinin",
            "How to diagnose pneumonia",
            "Treatment for severe malnutrition",
            "Signs of dehydration",
            "Vaccination schedule for infants"
        ];

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'result error' : 'result';
            div.innerHTML = msg;
            document.getElementById('output').appendChild(div);
            console.log('[TEST]', msg.replace(/<[^>]*>/g, ''));
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Show device info
        const info = {
            ua: navigator.userAgent,
            platform: navigator.platform,
            cores: navigator.hardwareConcurrency || 'unknown',
            memory: navigator.deviceMemory ? `${navigator.deviceMemory}GB` : 'unknown',
        };
        document.getElementById('device-info').innerHTML = `
            <strong>Device Info:</strong><br>
            Platform: ${info.platform}<br>
            Cores: ${info.cores}<br>
            Memory: ${info.memory}<br>
            UA: ${info.ua.substring(0, 80)}...
        `;

        async function runFullTest() {
            document.getElementById('start-btn').disabled = true;
            document.getElementById('output').innerHTML = '';

            log('<strong>=== BGE-M3 Q8 - PHYSICAL ARM DEVICE TEST ===</strong>');
            log('Starting full measurement suite...');

            try {
                // Import transformers
                log('<br><strong>1️⃣ Importing @xenova/transformers...</strong>');
                const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');

                env.allowRemoteModels = false;
                env.allowLocalModels = true;
                env.useBrowserCache = true;
                env.localModelPath = '/models/';
                log('✅ Library loaded, environment configured');

                // Test 1: Load bge-m3 q8
                log('<br><strong>2️⃣ Loading bge-m3 q8 (cold load)...</strong>');
                const loadStart = performance.now();
                let progressMsg = '';

                const model = await pipeline('feature-extraction', 'bge-m3', {
                    quantized: true,
                    progress_callback: (p) => {
                        if (p.progress !== undefined) {
                            const msg = `Loading: ${p.file} (${Math.round(p.progress)}%)`;
                            if (msg !== progressMsg) {
                                progressMsg = msg;
                                log(`<span class="progress">${msg}</span>`);
                            }
                        }
                    }
                });

                const loadTime = performance.now() - loadStart;
                log(`✅ Model loaded in <strong>${loadTime.toFixed(0)}ms</strong> (${(loadTime/1000).toFixed(1)}s)`);

                // Test 2: Verify output
                log('<br><strong>3️⃣ Verifying output dimensions...</strong>');
                const testOutput = await model("What is the treatment for malaria?", { pooling: 'cls', normalize: true });
                const dims = testOutput.data.length;
                if (dims !== 1024) {
                    throw new Error(`Wrong dimensions: ${dims} (expected 1024)`);
                }
                log(`✅ Dimensions correct: ${dims}`);

                // Test 3: Warm inference (10 queries)
                log('<br><strong>4️⃣ Warm inference latency (10 queries)...</strong>');
                const latencies = [];

                for (let i = 0; i < testQueries.length; i++) {
                    const start = performance.now();
                    await model(testQueries[i], { pooling: 'cls', normalize: true });
                    const latency = performance.now() - start;
                    latencies.push(latency);
                    log(`Query ${i+1}: ${latency.toFixed(1)}ms`);
                }

                const avgLatency = latencies.reduce((a, b) => a + b, 0) / latencies.length;
                const minLatency = Math.min(...latencies);
                const maxLatency = Math.max(...latencies);

                log(`<br><strong>📊 Latency Statistics:</strong>`);
                log(`Average: <strong>${avgLatency.toFixed(1)}ms</strong>`);
                log(`Min: ${minLatency.toFixed(1)}ms`);
                log(`Max: ${maxLatency.toFixed(1)}ms`);

                // Test 4: Memory
                log('<br><strong>5️⃣ Memory usage (single model)...</strong>');
                const mem1 = performance.memory ? {
                    used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024),
                    total: Math.round(performance.memory.totalJSHeapSize / 1024 / 1024),
                    limit: Math.round(performance.memory.jsHeapSizeLimit / 1024 / 1024)
                } : null;

                if (mem1) {
                    log(`Used: ${mem1.used}MB`);
                    log(`Total: ${mem1.total}MB`);
                    log(`Limit: ${mem1.limit}MB`);
                } else {
                    log('⚠️ Memory API not available');
                }

                // Test 5: Dual model (load MiniLM)
                log('<br><strong>6️⃣ Testing dual-model residency...</strong>');
                log('Loading MiniLM while bge-m3 still resident...');

                try {
                    const minilmStart = performance.now();
                    const minilmModel = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
                        quantized: true,
                        progress_callback: (p) => {
                            if (p.progress !== undefined && p.progress % 20 === 0) {
                                log(`<span class="progress">MiniLM: ${p.file} (${Math.round(p.progress)}%)</span>`);
                            }
                        }
                    });
                    const minilmTime = performance.now() - minilmStart;
                    log(`✅ MiniLM loaded in ${minilmTime.toFixed(0)}ms`);

                    // Test both work
                    const bgeTest = await model("Test bge-m3", { pooling: 'cls', normalize: true });
                    const minilmTest = await minilmModel("Test MiniLM", { pooling: 'mean', normalize: true });
                    log(`✅ bge-m3 working: ${bgeTest.data.length} dims`);
                    log(`✅ MiniLM working: ${minilmTest.data.length} dims`);

                    // Dual memory
                    const mem2 = performance.memory ? {
                        used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024),
                        total: Math.round(performance.memory.totalJSHeapSize / 1024 / 1024)
                    } : null;

                    if (mem2 && mem1) {
                        log(`<br><strong>📊 Dual-Model Memory:</strong>`);
                        log(`Single model: ${mem1.used}MB`);
                        log(`Dual model: ${mem2.used}MB`);
                        log(`MiniLM overhead: ${mem2.used - mem1.used}MB`);
                        log(`Dual total: ${mem2.total}MB`);

                        if (mem2.total < mem2.limit * 0.8) {
                            log('✅ DUAL-MODEL VIABLE (within memory limits)');
                        } else {
                            log('⚠️ DUAL-MODEL TIGHT (approaching memory limit)');
                        }
                    }

                } catch (dualError) {
                    log(`❌ Dual-model test failed: ${dualError.message}`, true);
                    log('This indicates memory pressure or resource limits', true);
                }

                // Final summary
                log('<br><strong>=== FINAL RESULTS ===</strong>');
                log(`<strong>Device:</strong> Physical ARM Android (${info.cores} cores)`);
                log(`<br><strong>bge-m3 q8 Performance:</strong>`);
                log(`Cold Load: ${(loadTime/1000).toFixed(1)}s`);
                log(`Avg Latency: <strong>${avgLatency.toFixed(1)}ms</strong>`);

                const vsMinilm = (avgLatency / 10).toFixed(2);
                const vsEmulator = (avgLatency / 90.9).toFixed(2);
                log(`vs MiniLM (10ms): <strong>${vsMinilm}x</strong> slower`);
                log(`vs x86 emulator (90.9ms): <strong>${vsEmulator}x</strong>`);

                if (mem1) {
                    log(`Memory: ${mem1.used}MB used, ${mem1.total}MB total`);
                }

                // Verdict
                log('<br><strong>=== VERDICT ===</strong>');
                if (avgLatency <= 50) {
                    log('✅ <strong>ACCEPTABLE</strong>: Latency within 5x MiniLM threshold');
                } else if (avgLatency <= 100) {
                    log('⚠️ <strong>MARGINAL</strong>: Latency 5-10x MiniLM baseline');
                } else {
                    log('❌ <strong>NOT VIABLE</strong>: Latency >10x MiniLM baseline');
                }

                log('<br><strong>Test complete!</strong>');

                // Final structured output for extraction
                const results = {
                    device: 'Physical ARM Android',
                    cores: info.cores,
                    coldLoad: loadTime,
                    avgLatency,
                    minLatency,
                    maxLatency,
                    vsMinilm,
                    vsEmulator,
                    memory: mem1
                };

                console.log('[RESULTS]', JSON.stringify(results, null, 2));
                log(`<br><pre>${JSON.stringify(results, null, 2)}</pre>`);

            } catch (error) {
                log(`<br><strong>❌ TEST FAILED</strong>`, true);
                log(`Error: ${error.message}`, true);
                log(`<pre>${error.stack}</pre>`, true);
            } finally {
                document.getElementById('start-btn').disabled = false;
            }
        }

        window.runFullTest = runFullTest;

        // Auto-start if URL has ?autorun
        if (window.location.search.includes('autorun')) {
            setTimeout(() => runFullTest(), 1000);
        }
    </script>
</body>
</html>
