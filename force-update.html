<!DOCTYPE html>
<html>
<head>
  <title>Force Update</title>
</head>
<body>
  <h1>Forcing HIV File Update</h1>
  <div id="status">Checking...</div>
  <script type="module">
    // Force update by clearing version cache
    localStorage.removeItem('hiva_known_version');

    // Use the update service directly
    const UPDATE_ENDPOINT = 'https://compiler.hiva.chat/api/hiv';

    const status = document.getElementById('status');

    async function forceUpdate() {
      try {
        // Get version info
        status.textContent = 'Fetching version info...';
        const versionRes = await fetch(`${UPDATE_ENDPOINT}/version`);
        const meta = await versionRes.json();
        status.textContent = `Found version: ${meta.version} (${meta.size_kb}KB, ${meta.chunk_count} chunks)`;

        // Download without auth (public endpoint)
        status.textContent += '\n\nDownloading...';
        const downloadRes = await fetch(`${UPDATE_ENDPOINT}/download`);

        if (!downloadRes.ok) {
          const error = await downloadRes.text();
          status.textContent += `\n\nError: ${error}`;
          return;
        }

        const buffer = await downloadRes.arrayBuffer();
        status.textContent += `\n\nDownloaded ${(buffer.byteLength / 1024 / 1024).toFixed(2)}MB`;

        // Save to file
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hiv-cache-${meta.version}.bin`;
        a.click();

        status.textContent += `\n\n✅ Downloaded as hiv-cache-${meta.version}.bin`;
        status.textContent += '\n\nCopy this file to the project root as hiv-cache.bin';

      } catch (err) {
        status.textContent += `\n\n❌ Error: ${err.message}`;
      }
    }

    forceUpdate();
  </script>
</body>
</html>
