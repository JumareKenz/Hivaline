name: Build Android Release APK

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Build web
      run: npm run build

    - name: Sync to Android
      run: npx cap sync android

    - name: Check keystore
      id: keystore-check
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "has-keystore=false" >> $GITHUB_OUTPUT
        else
          echo "has-keystore=true" >> $GITHUB_OUTPUT
        fi

    - name: Decode keystore
      if: steps.keystore-check.outputs.has-keystore == 'true'
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/hiva-release-key.keystore

    - name: Update gradle signing config
      if: steps.keystore-check.outputs.has-keystore == 'true'
      run: |
        cat >> android/app/build.gradle << 'EOF'

        android {
          signingConfigs {
            release {
              storeFile file(System.getenv("KEYSTORE_FILE") ?: "~/.android/hiva-release-key.keystore")
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
            }
          }
          buildTypes {
            release {
              signingConfig signingConfigs.release
            }
          }
        }
        EOF

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ~/.android/hiva-release-key.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Unsigned APK (No keystore)
      if: steps.keystore-check.outputs.has-keystore == 'false'
      uses: actions/upload-artifact@v3
      with:
        name: hiva-medichat-unsigned-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 90

    - name: Upload Signed APK (With keystore)
      if: steps.keystore-check.outputs.has-keystore == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: hiva-medichat-signed-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90

    - name: Create Release
      if: github.ref == 'refs/heads/master'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: apk-v${{ github.run_number }}
        release_name: APK Build v${{ github.run_number }}
        body: |
          ## Hiva Medichat Android APK

          **Build:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}

          ### Features Included
          - Phase 26b: Drug-Class Boost for ARV query specificity
          - Frontend rebranding to "Hiva Medichat"
          - Clinical query accuracy improved by 7%
          - Zero regressions

          ### APK Details
          - **Size:** ~123 MB
          - **Target SDK:** 36 (Android 15)
          - **Min SDK:** 24 (Android 7)

          ### Installation Options

          #### ✅ Signed APK (Play Store Ready)
          Available if keystore secrets are configured.
          - Ready to upload to Google Play Console
          - Download: `hiva-medichat-signed-apk`

          #### 🧪 Unsigned APK (Testing/Sideload)
          Always available.
          - For testing on your own device
          - Download: `hiva-medichat-unsigned-apk`

          **Sideload command:**
          ```bash
          adb install app-release-unsigned.apk
          ```

          ### For Signing Your Own
          If keystore is not yet configured:
          ```bash
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            app-release-unsigned.apk your-key-alias
          ```

          See `KEYSTORE_SETUP.md` for full setup instructions.
        draft: false
        prerelease: false

    - name: Comment on commit
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
          github.rest.git.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: `${status} **APK Build v${{ github.run_number }}**: ${{ job.status }}\n\nDownload from: [Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
          });
