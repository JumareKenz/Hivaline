name: Build Android Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build web
      run: npm run build

    - name: Sync to Android
      run: npx cap sync android

    - name: Check keystore
      id: keystore-check
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "has-keystore=false" >> $GITHUB_OUTPUT
        else
          echo "has-keystore=true" >> $GITHUB_OUTPUT
        fi

    - name: Decode keystore
      if: steps.keystore-check.outputs.has-keystore == 'true'
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/hiva-release-key.keystore

    - name: Update gradle signing config
      if: steps.keystore-check.outputs.has-keystore == 'true'
      run: |
        cat >> android/app/build.gradle << 'EOF'

        android {
          signingConfigs {
            release {
              storeFile file(System.getenv("KEYSTORE_FILE") ?: "~/.android/hiva-release-key.keystore")
              storePassword System.getenv("KEYSTORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
            }
          }
          buildTypes {
            release {
              signingConfig signingConfigs.release
            }
          }
        }
        EOF

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ~/.android/hiva-release-key.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Unsigned APK (No keystore)
      if: steps.keystore-check.outputs.has-keystore == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: hiva-medichat-unsigned-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 90

    - name: Upload Signed APK (With keystore)
      if: steps.keystore-check.outputs.has-keystore == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: hiva-medichat-signed-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90

    - name: List APK artifacts
      run: ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || echo "No APK found"

    - name: Build Status
      if: always()
      run: echo "APK build ${{ job.status }}"
