<!DOCTYPE html>
<html>
<head><title>Login and Download HIVFile</title></head>
<body>
<h1>Logging in and downloading .hiv file</h1>
<pre id="output">Starting...</pre>
<script>
const API_BASE = 'https://compiler.hiva.chat';
const output = document.getElementById('output');

async function loginAndDownload() {
  try {
    // Step 1: Login
    output.textContent = 'Logging in with access code FP9A...\n';
    const authRes = await fetch(`${API_BASE}/api/hiv/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        server_code: 'FP9A',
        access_key: 'FP9A'
      }),
    });

    if (!authRes.ok) {
      const error = await authRes.text();
      output.textContent += `Login failed: ${error}\n`;
      return;
    }

    const authData = await authRes.json();
    output.textContent += `✅ Logged in as: ${authData.user_profile.name}\n`;
    output.textContent += `Token: ${authData.token.substring(0, 20)}...\n\n`;

    // Step 2: Get version info
    output.textContent += 'Fetching version info...\n';
    const versionRes = await fetch(`${API_BASE}/api/hiv/version`);
    const meta = await versionRes.json();
    output.textContent += `Version: ${meta.version}\n`;
    output.textContent += `Size: ${(meta.size_kb / 1024).toFixed(2)}MB\n`;
    output.textContent += `Chunks: ${meta.chunk_count}\n\n`;

    // Step 3: Download with auth token
    output.textContent += 'Downloading .hiv file...\n';
    const downloadRes = await fetch(`${API_BASE}/api/hiv/download`, {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${authData.token}`,
        'Accept': 'application/octet-stream',
      },
    });

    if (!downloadRes.ok) {
      const error = await downloadRes.text();
      output.textContent += `Download failed: ${error}\n`;
      return;
    }

    const buffer = await downloadRes.arrayBuffer();
    output.textContent += `✅ Downloaded ${(buffer.byteLength / 1024 / 1024).toFixed(2)}MB\n\n`;

    // Step 4: Save to file
    const blob = new Blob([buffer], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hiv-cache.bin';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    output.textContent += '✅ Downloading as hiv-cache.bin\n';
    output.textContent += '\nReplace the existing hiv-cache.bin in your project with this file.';

  } catch (err) {
    output.textContent += `\n❌ Error: ${err.message}\n${err.stack}`;
  }
}

loginAndDownload();
</script>
</body>
</html>
